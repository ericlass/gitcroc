[package]
name = "gitcroc-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
# Random delimiter tokens of the prompt (SEC-5).
uuid.workspace = true
# The mock provider's gate (M4-01).
tokio = { workspace = true, features = ["sync"], optional = true }

[dev-dependencies]
# The integration tests drive the ask loop through the mock provider.
gitcroc-ai = { path = ".", features = ["mock"] }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[features]
# The scripted provider of the tests and the `e2e` build (M4-01). Never in a
# release bundle.
mock = ["dep:tokio"]

[lints]
workspace = true
