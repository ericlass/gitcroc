[package]
name = "gitcroc-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gitcroc"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64.workspace = true
thiserror.workspace = true
tauri = { workspace = true, features = ["specta"] }
tauri-plugin-dialog.workspace = true
# The update check and install (PLAT-4); the only network call the app
# makes on its own (D12).
tauri-plugin-updater.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tokio = { workspace = true, features = ["fs", "time", "net", "io-util", "sync", "macros", "rt"] }
# The askpass socket (D10): its private directory, and the tokens.
tempfile.workspace = true
uuid.workspace = true
gitcroc-core.workspace = true
gitcroc-ai.workspace = true
# AI keys (D11, M4-05).
keyring.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
tikv-jemallocator = { workspace = true, features = ["background_threads"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tikv-jemalloc-ctl.workspace = true

[dev-dependencies]
# The mock provider stands in for a real one in the consent tests (AI-6).
gitcroc-ai = { workspace = true, features = ["mock"] }
gitcroc-git.workspace = true
toml.workspace = true
repo-gen.workspace = true

[features]
# M5-15: local updater proof on hosted runners, never a release bundle.
update-test = []
# M1-12: the UI-side measurements of `just bench-ui`. Never in a release
# bundle; `just bench-ui` builds with it into its own target dir.
perf-trace = []
# M2-15: the end-to-end smoke test of `just smoke`, whose folder dialog is
# answered by GITCROC_E2E_PICK_FOLDER. Never in a release bundle; `just
# smoke` builds with it into its own target dir. It also turns on the mock AI
# provider (M4-01).
e2e = ["gitcroc-ai/mock"]

[lints]
workspace = true
