[package]
name = "gitcroc-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "time", "net", "io-util", "sync", "macros", "rt"] }
# The askpass socket (D10): its private directory, and the tokens.
tempfile.workspace = true
uuid.workspace = true
gitcroc-core.workspace = true
gitcroc-ai.workspace = true
# AI keys (D11, M4-05).
keyring.workspace = true
# The updater (PLAT-4, SEC-7, M6-27): the manifest and the package over
# HTTPS, the package's signature, and the manifest's versions.
reqwest.workspace = true
minisign-verify.workspace = true
base64.workspace = true
semver.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS app's update package, a `.app.tar.gz` (PLAT-4).
flate2.workspace = true
tar.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["background_threads"] }
# The desktop's fonts through the settings portal (UI-26).
ashpd.workspace = true
async-io.workspace = true
futures-lite.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tikv-jemalloc-ctl.workspace = true

[dev-dependencies]
# The mock provider stands in for a real one in the consent tests (AI-6).
gitcroc-ai = { workspace = true, features = ["mock"] }
gitcroc-git.workspace = true
repo-gen.workspace = true
# The tests' runtimes; Tauri brought this feature in for every platform.
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Signs the updater tests' packages as `tauri signer` does (SEC-7), and
# lists the manifest's platform keys (PLAT-4).
minisign.workspace = true
release-manifest = { path = "../../tools/release-manifest" }
# Reads the crates' features (D12, M6-28c).
toml.workspace = true

[features]
# The scripted AI provider for the smoke test (M4-12), which M6-29 brings
# back. Never in a release build.
e2e = ["gitcroc-ai/mock"]
# M6-28c's update test: the updater's endpoint, a loopback address, and the
# test key come from GITCROC_UPDATE_TEST_ENDPOINT and GITCROC_UPDATE_TEST_KEY
# at build time (SEC-7), and the app checks at start and installs without
# asking (`update::at_start`). Never in a release build: not a default, and
# only packages.yml's `update-test` input passes it. Without it the endpoint
# and the key are fixed.
update-test = []

# Started by the askpass tests as git's helper (D10), in place of the app's
# binary, which runs the same `askpass::helper` first.
[[bin]]
name = "askpass-helper"
path = "tests/support/askpass_helper.rs"
test = false
doc = false

[lints]
workspace = true
