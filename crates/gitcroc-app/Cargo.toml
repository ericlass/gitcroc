[package]
name = "gitcroc-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# The derives of the types the core shares, until M6-30 removes specta.
specta.workspace = true
tokio = { workspace = true, features = ["fs", "time", "net", "io-util", "sync", "macros", "rt"] }
# The askpass socket (D10): its private directory, and the tokens.
tempfile.workspace = true
uuid.workspace = true
gitcroc-core.workspace = true
gitcroc-ai.workspace = true
# AI keys (D11, M4-05).
keyring.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["background_threads"] }
# The desktop's fonts through the settings portal (UI-26).
ashpd.workspace = true
async-io.workspace = true
futures-lite.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tikv-jemalloc-ctl.workspace = true

[dev-dependencies]
# The mock provider stands in for a real one in the consent tests (AI-6).
gitcroc-ai = { workspace = true, features = ["mock"] }
gitcroc-git.workspace = true
repo-gen.workspace = true
# The tests' runtimes; Tauri brought this feature in for every platform.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
# The scripted AI provider for the smoke test (M4-12), which M6-29 brings
# back. Never in a release build.
e2e = ["gitcroc-ai/mock"]

# Started by the askpass tests as git's helper (D10), in place of the app's
# binary, which runs the same `askpass::helper` first.
[[bin]]
name = "askpass-helper"
path = "tests/support/askpass_helper.rs"
test = false
doc = false

[lints]
workspace = true
