[package]
name = "gitcroc-ui"
description = "gitcroc's native UI, on GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gitcroc-next"

# The GPUI app. Its packages install it as `gitcroc` (M6-28); the Cargo
# binary keeps this name until M6-30.
[[bin]]
name = "gitcroc-next"
path = "src/main.rs"

[dependencies]
gitcroc-app.workspace = true
gitcroc-core.workspace = true
gpui-kit.workspace = true
gpui-component.workspace = true
# The runtime the app's work runs on (ARCH-7), and the channels to it.
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
# The home folder a save dialog starts in.
directories.workspace = true
# A job's start as the local time of day (UI-21).
chrono.workspace = true
# The code themes' highlighting (UI-24).
syntect.workspace = true
# The theme files gpui-component reads, built from the tokens (UI-23),
# and the benchmark runner's script and trace (PERF-8).
serde_json.workspace = true
serde.workspace = true

# The accent colour (UI-23): the appearance portal.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
futures-lite.workspace = true

# The accent colour (UI-23): `UISettings`, a WinRT API without `unsafe`.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["UI_ViewManagement"] }

[features]
# Real-window smoke scripts; never enabled by packaging.
e2e = ["gpui-kit/test-support", "gitcroc-app/e2e"]
# `gitcroc-next --bench <script>`: the UI-side benchmark runner (PERF-8),
# which `just bench-ui` builds into its own target folder. Never in a
# release build. The runner finds what it clicks through gpui-kit's
# element registry, which only its `test-support` keeps.
perf-trace = ["gpui-kit/test-support"]

[dev-dependencies]
# The integration tests play a bench script (PERF-8).
gitcroc-ui = { path = ".", features = ["perf-trace"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The fake AI backend's scripted provider (M6-23a).
gitcroc-ai = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["time"] }
syn.workspace = true
# The scan's line numbers.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# A settings file with a chosen git (PLAT-3).
toml.workspace = true
# Fixture repos for the tree (QA-2).
repo-gen.workspace = true
# Folders as the core names them, without Windows' `\\?\` (M6-20).
dunce.workspace = true
# The package names it finds in a release (M6-28).
release-manifest = { path = "../../tools/release-manifest" }

# The accessibility tree test reads AT-SPI (M6-25a).
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus.workspace = true
atspi-common.workspace = true

# The accessibility tree of a real window, under Xvfb with an AT-SPI bus
# (M6-25a): `just a11y`. Without that session it prints that it skipped.
[[test]]
name = "a11y_tree"
path = "tests/a11y_tree/main.rs"
harness = false

[lints]
workspace = true

# The packages of section 11 (M6-28). `.github/workflows/packages.yml`
# builds `gitcroc-next` once per package with GITCROC_BUNDLE set (PLAT-4),
# copies it beside itself as `gitcroc`, and packages that: cargo-packager
# 0.11.8 makes the NSIS installer, the `.app` and `.dmg`, the AppImage and
# the `.deb`; cargo-generate-rpm 0.21.1 makes the `.rpm`. Nothing is
# code-signed; the macOS app is signed ad hoc (SEC-7).
[package.metadata.packager]
product-name = "gitcroc"
identifier = "dev.gitcroc.desktop"
publisher = "gitcroc"
category = "DeveloperTool"
description = "Git client for multi-repo projects"
binaries = [{ path = "gitcroc", main = true }]
# The icons 1.0.0-rc.1 shipped.
icons = [
    "../gitcroc-app/icons/32x32.png",
    "../gitcroc-app/icons/128x128.png",
    "../gitcroc-app/icons/128x128@2x.png",
    "../gitcroc-app/icons/icon.icns",
    "../gitcroc-app/icons/icon.ico",
]

[package.metadata.packager.windows]
# The installer refuses a downgrade, as an update must (PLAT-4).
allow-downgrades = false

# For the current user, in %LOCALAPPDATA%\gitcroc, over rc.1's install.
[package.metadata.packager.nsis]
installer-mode = "currentUser"
template = "packaging/nsis/installer.nsi"

# Linked (`ldd`) and loaded at run time (`dlopen`), from M6-03, and a font:
# GPUI cannot start without one and none is embedded (D6).
[package.metadata.packager.deb]
depends = [
    "libc6 (>= 2.35)",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libvulkan1",
    "libegl1",
    "libwayland-client0",
    "libwayland-egl1",
    "fonts-dejavu-core",
]

[package.metadata.packager.macos]
signing-identity = "-"
minimum-system-version = "12.0"

# The workflow sets the RPM version, the workspace's with `~` for `-`.
[package.metadata.generate-rpm]
name = "gitcroc"
summary = "Git client for multi-repo projects"
assets = [
    { source = "target/release/gitcroc", dest = "/usr/bin/gitcroc", mode = "755" },
    { source = "packaging/linux/gitcroc.desktop", dest = "/usr/share/applications/gitcroc.desktop", mode = "644" },
    { source = "../gitcroc-app/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/gitcroc.png", mode = "644" },
    { source = "../gitcroc-app/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/gitcroc.png", mode = "644" },
    { source = "../gitcroc-app/icons/128x128@2x.png", dest = "/usr/share/icons/hicolor/256x256@2/apps/gitcroc.png", mode = "644" },
]

# Fedora's names for the `.deb`'s dependencies.
[package.metadata.generate-rpm.requires]
libxcb = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
vulkan-loader = "*"
libglvnd-egl = "*"
libwayland-client = "*"
libwayland-egl = "*"
dejavu-sans-fonts = "*"
