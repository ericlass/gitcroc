[package]
name = "gitcroc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gitcroc-core.workspace = true
# The mock provider of `conflict ai-resolve --mock` (M4-08). The CLI is not
# in the release bundle.
gitcroc-ai = { workspace = true, features = ["mock"] }
serde_json.workspace = true
# The prompt eval's report and its fixtures' `meta.toml` (M4-11).
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
# The bench's throwaway config and cache dirs.
tempfile.workspace = true

[dev-dependencies]
repo-gen.workspace = true
cargo_metadata.workspace = true

[lints]
workspace = true
