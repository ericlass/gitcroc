# Throwaway M5-14 proof only. This commit must never be merged.
name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  broken-portable:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      INSTALL_LOGS: ${{ github.workspace }}/install-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gitcroc-0.1.0-windows-x64
          run-id: 39423982049
          github-token: ${{ github.token }}
          path: artifacts
      - name: Deliberately remove the binary from the portable zip
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          archive = next(Path("artifacts").glob("*-portable.zip"))
          with ZipFile(archive) as source:
              kept = [(item, source.read(item)) for item in source.infolist() if not item.filename.endswith("/gitcroc.exe")]
          with ZipFile(archive, "w") as target:
              for item, data in kept:
                  target.writestr(item, data)
          print("Intentionally broken portable zip: gitcroc.exe removed")
          PYTHON
      - name: Install and start; the missing portable binary must fail this job
        shell: pwsh
        run: .github/scripts/install-windows.ps1 -Artifacts "$pwd/artifacts" -Version '0.1.0'
      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broken-portable-install-logs
          path: ${{ env.INSTALL_LOGS }}
