# QA-1 and QA-5: every pull request runs `just check` on all three
# platforms, through `just check-rust`, so local and CI checks cannot drift.
# The GPUI UI's tests are headless and need no display or GPU; a real
# window is started once per runner after them (M6-03, M6-06).
# The smoke test (section 12) comes back with M6-29. The jobs named
# `check (<os>)` that the ruleset of main requires wait for the others.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: smaller objects link and cache much faster,
  # Windows most of all. Panics still name the file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: check-rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 has glibc 2.35, the Linux floor of D6.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # GPUI makes a cold build several minutes longer (M6-03).
    timeout-minutes: 45
    steps:
      # D13: integration tests rely on git 2.40 or newer.
      - name: Check git version
        shell: bash
        run: |
          git --version
          version=$(git --version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/')
          read -r major minor <<< "$version"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::git $major.$minor is older than 2.40 (D13)"
            exit 1
          fi

      - uses: actions/checkout@v7

      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,cargo-deny@0.20.2

      # GPUI's build needs these on Linux (M6-03): xkbcommon and xcb for X11
      # and Wayland input, fontconfig and freetype for font-kit. Xvfb and
      # Mesa's lavapipe are for the first-frame step; no Wayland, where
      # headless Weston has no seat and GPUI panics.
      - name: Install GPUI's Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            xvfb mesa-vulkan-drivers

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: just check-rust
        run: just check-rust

      # A real window opens and presents a frame (M6-03): under Xvfb with
      # lavapipe on Linux, on WARP on Windows, on Metal on macOS. The test
      # build has already built the binary.
      - name: gitcroc-next presents its first frame
        shell: bash
        timeout-minutes: 5
        run: |
          cargo build -p gitcroc-ui --bin gitcroc-next
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a target/debug/gitcroc-next --exit-after-first-frame
          else
            target/debug/gitcroc-next --exit-after-first-frame
          fi

      # D11, SEC-1: a unique test service, never gitcroc's credentials.
      # Linux hosted runners have no Secret Service; that check stays local.
      - name: Real OS keychain round trip
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test -p gitcroc-app --test integration keychain::d11_os_keychain_round_trip -- --ignored --exact

  # The checks the main branch's ruleset requires, one per platform. Each
  # passes when every job above passed, so the ruleset need not list them.
  check:
    name: check (${{ matrix.os }})
    needs: [rust]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
