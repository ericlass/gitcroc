# QA-1 (Rust half) and QA-5: every pull request runs `just check` on all three
# platforms. Only `just check` runs here, so local and CI checks cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 has glibc 2.35, the Linux floor of D6.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # D13: integration tests rely on git 2.40 or newer.
      - name: Check git version
        shell: bash
        run: |
          git --version
          version=$(git --version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/')
          read -r major minor <<< "$version"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::git $major.$minor is older than 2.40 (D13)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,cargo-deny@0.20.2

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: just check
        run: just check
