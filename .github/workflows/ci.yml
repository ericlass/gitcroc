# QA-1 and QA-5: every pull request runs `just check` on all three
# platforms. Only `just check`'s two halves run here, `just check-rust` and
# `just check-ui` as separate jobs in parallel, so local and CI checks cannot
# drift; and on Linux and Windows `just smoke`, the end-to-end smoke test
# (section 12, M5-16). The jobs named `check (<os>)` that the ruleset of
# main requires wait for all of them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: smaller objects link and cache much faster,
  # Windows most of all. Panics still name the file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: check-rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 has glibc 2.35, the Linux floor of D6.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # D13: integration tests rely on git 2.40 or newer.
      - name: Check git version
        shell: bash
        run: |
          git --version
          version=$(git --version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/')
          read -r major minor <<< "$version"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::git $major.$minor is older than 2.40 (D13)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,cargo-deny@0.20.2

      # Build packages for Tauri's Linux backend (WebKitGTK 4.1).
      - name: Install WebKitGTK build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: just check-rust
        run: just check-rust

      # D11, SEC-1: a unique test service, never gitcroc's credentials.
      # Linux hosted runners have no Secret Service; that check stays local.
      - name: Real OS keychain round trip
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo test -p gitcroc-app --test integration keychain::d11_os_keychain_round_trip -- --ignored --exact

  ui:
    name: check-ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      # Installs the pnpm version in ui/package.json's packageManager field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Playwright's default browser directory on each platform. The lockfile
      # pins the Playwright version, which pins the browser build.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Install front-end packages and Chromium
        run: just setup

      - name: just check-ui
        run: just check-ui

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      # WebKitGTK 4.1 to build; WebDriver for it, and a display for the app.
      - name: Install build packages and the smoke test's drivers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev webkit2gtk-driver xvfb

      # Select an installed WebView2 runtime and pin the app to it via
      # WEBVIEW2_BROWSER_EXECUTABLE_FOLDER. Download its exact driver version
      # from Microsoft, verify it, and record both versions and the OS build.
      - name: Install matching Microsoft Edge WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/install-edge-driver.ps1

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.os }}

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Installs the pnpm version in ui/package.json's packageManager field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install front-end packages
        run: pnpm --dir ui install --frozen-lockfile

      - name: just smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a just smoke

      - name: just smoke (Windows)
        if: runner.os == 'Windows'
        run: just smoke

      - name: Upload the smoke test's failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ matrix.os }}
          path: target/e2e/failure.png
          if-no-files-found: ignore

  # The checks the main branch's ruleset requires, one per platform. Each
  # passes when every job above passed, so the ruleset need not list them.
  check:
    name: check (${{ matrix.os }})
    needs: [rust, ui, smoke]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
