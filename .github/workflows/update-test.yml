# PLAT-4, SEC-7, D12: test keys and loopback endpoints exist only in this job.
name: Update test
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/update-test.yml'
      - '.github/scripts/**'
      - 'crates/gitcroc-app/src/update*'
      - 'crates/gitcroc-app/src/lib.rs'
      - 'crates/gitcroc-app/src/platform/**'
      - 'crates/gitcroc-app/Cargo.toml'
      - 'crates/gitcroc-app/tauri*.json'
      - 'crates/gitcroc-core/src/update.rs'
      - 'tools/release-manifest/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install
      - name: Add universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - name: Install Linux dependencies before building
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev librsvg2-dev patchelf xvfb libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          key: update-test-${{ matrix.os }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Test the proof's assertions with simulated outcomes
        run: python .github/scripts/test-update.py
      - name: Check the test feature
        run: cargo clippy -p gitcroc-app --features update-test --all-targets -- -D warnings
      - name: Build A and B with a key made inside this job
        run: python .github/scripts/update_build.py
      # Everything below uses installed dependencies and the local server only.
      - name: Exercise installed updates
        if: runner.os != 'Linux'
        run: python .github/scripts/update_test.py
      - name: Exercise installed updates under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a python .github/scripts/update_test.py
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: update-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/gitcroc-update-test/logs/
          if-no-files-found: ignore
