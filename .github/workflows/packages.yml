# The packages of section 11 (D6) from the GPUI app, without Tauri's
# bundler (M6-28), and their install tests, which replace M5-14's. build.yml
# calls this workflow, and so does release.yml (M6-28b), so the build steps
# live only here.
#
# Each package's binary is its own release build of `gitcroc` with
# GITCROC_BUNDLE set, which marks the package it came from (PLAT-4). The
# portable zip packs the installer's binary, and the .dmg holds
# the .app. Nothing is code-signed or notarized; the macOS app and .dmg are
# signed ad hoc (SEC-7). No update package is signed here; release.yml signs
# them with the updater key (M6-28b).
#
# The file names are 1.0.0-rc.1's, which tools/release-manifest finds.
#
# With `update-test` (update-test.yml, M6-28c), each build job also makes a
# throwaway updater key with `release-manifest keygen`, builds every binary
# with the `update-test` feature, that key's public half and the local
# endpoint, then builds B, the version with the patch number raised by one,
# and signs B's update package with the key. The key's secret half never
# leaves the job: it is deleted with the job's last step. B, its .sig and
# the public key are uploaded as update-test-<platform>; the install tests
# do not run. release.yml never passes it (D12).
name: Packages

on:
  workflow_call:
    inputs:
      version:
        description: "The version the packages are named for; it must be the workspace's. Empty takes the workspace's."
        type: string
        required: false
        default: ""
      update-archives:
        description: "Also make the macOS update archive, gitcroc.app.tar.gz"
        type: boolean
        required: false
        default: false
      update-test:
        description: "Build the update test's A and B with the update-test feature and a throwaway key (M6-28c); never for a release"
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: "The version of the packages"
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version lives in the workspace Cargo.toml only.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the workspace version
        id: version
        env:
          WANTED: ${{ inputs.version }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ -n "$WANTED" ] && [ "$WANTED" != "$version" ]; then
            echo "::error::the version is $WANTED, but Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gitcroc $version" | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    name: build (windows-x64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: packages-windows${{ inputs.update-test && '-update-test' || '' }}
      # The update test's key (M6-28c). Its public half and the local
      # endpoint go into every binary of this job; its secret half signs
      # B's update package and is deleted in the job's last step.
      - name: Make the update test's key
        if: inputs.update-test
        run: |
          cargo build --quiet --locked -p release-manifest
          target/debug/release-manifest keygen "$RUNNER_TEMP/update-test.key" > "$RUNNER_TEMP/update-test.pub"
          {
            echo "GITCROC_UPDATE_TEST_KEY=$(cat "$RUNNER_TEMP/update-test.pub")"
            echo "GITCROC_UPDATE_TEST_ENDPOINT=http://127.0.0.1:8765/latest.json"
            echo "FEATURES=--features gitcroc-app/update-test"
          } >> "$GITHUB_ENV"
      - name: Build the installer's binary
        env:
          GITCROC_BUNDLE: nsis
        run: cargo build --release --locked -p gitcroc-ui --bin gitcroc $FEATURES
      - name: Package the NSIS installer
        run: |
          mkdir -p dist
          cargo packager --release -p gitcroc-ui --formats nsis --out-dir dist
      # The installer's binary, as M0-08 packed it.
      - name: Pack the portable zip
        run: |
          portable="gitcroc-${VERSION}-windows-x64-portable"
          mkdir "$portable"
          cp target/release/gitcroc.exe "$portable/"
          7z a "dist/gitcroc-${VERSION}-windows-x64-portable.zip" "$portable"
      - name: Collect the packages
        run: |
          mkdir upload
          for file in "gitcroc_${VERSION}_x64-setup.exe" "gitcroc-${VERSION}-windows-x64-portable.zip"; do
            mv "dist/$file" upload/
          done
          ls -l upload | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: gitcroc-${{ env.VERSION }}-windows-x64
          path: upload/*
          if-no-files-found: error

      # B (M6-28c): the workspace at A's patch number plus one.
      - name: Build and package B
        if: inputs.update-test
        env:
          GITCROC_BUNDLE: nsis
        run: |
          newer=$(python .github/scripts/update_version.py --bump)
          echo "NEWER=$newer" >> "$GITHUB_ENV"
          cargo build --release --locked -p gitcroc-ui --bin gitcroc $FEATURES
          # As for A: cargo-packager takes an out-dir that does not exist yet
          # as relative to the crate.
          mkdir -p dist/b
          cargo packager --release -p gitcroc-ui --formats nsis --out-dir dist/b
      # The only step with the update test's secret key in its environment.
      - name: Sign B's update package with the update test's key
        if: inputs.update-test
        run: |
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/update-test.key") \
            target/debug/release-manifest sign --version "$NEWER" "dist/b/gitcroc_${NEWER}_x64-setup.exe"
      - name: Collect B
        if: inputs.update-test
        run: |
          mkdir upload-b
          for file in "dist/b/gitcroc_${NEWER}_x64-setup.exe"; do
            mv "$file" "$file.sig" upload-b/
          done
          cp "$RUNNER_TEMP/update-test.pub" upload-b/
          ls -l upload-b | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: inputs.update-test
        with:
          name: update-test-windows-x64
          path: upload-b/*
          if-no-files-found: error
      - name: Delete the update test's key
        if: always() && inputs.update-test
        run: rm -f "$RUNNER_TEMP/update-test.key"

  macos:
    name: build (macos-universal)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain and both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: packages-macos${{ inputs.update-test && '-update-test' || '' }}
      # The update test's key (M6-28c). Its public half and the local
      # endpoint go into every binary of this job; its secret half signs
      # B's update package and is deleted in the job's last step.
      - name: Make the update test's key
        if: inputs.update-test
        run: |
          cargo build --quiet --locked -p release-manifest
          target/debug/release-manifest keygen "$RUNNER_TEMP/update-test.key" > "$RUNNER_TEMP/update-test.pub"
          {
            echo "GITCROC_UPDATE_TEST_KEY=$(cat "$RUNNER_TEMP/update-test.pub")"
            echo "GITCROC_UPDATE_TEST_ENDPOINT=http://127.0.0.1:8765/latest.json"
            echo "FEATURES=--features gitcroc-app/update-test"
          } >> "$GITHUB_ENV"
      - name: Build the app's binary for both architectures
        env:
          GITCROC_BUNDLE: app
        run: |
          cargo build --release --locked -p gitcroc-ui --bin gitcroc --target aarch64-apple-darwin $FEATURES
          cargo build --release --locked -p gitcroc-ui --bin gitcroc --target x86_64-apple-darwin $FEATURES
      # D6: one universal binary, joined with lipo.
      - name: Join them into a universal binary
        run: |
          out=target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/gitcroc" \
            target/aarch64-apple-darwin/release/gitcroc target/x86_64-apple-darwin/release/gitcroc
          lipo -info "$out/gitcroc"
      # cargo-packager signs the .app with the identity `-` of the config.
      - name: Package the .app and .dmg, ad hoc signed
        run: |
          mkdir -p dist
          cargo packager --release -p gitcroc-ui --target universal-apple-darwin --formats app,dmg --out-dir dist
          codesign --force -s - "dist/gitcroc_${VERSION}_universal.dmg"
          codesign --verify --deep --strict dist/gitcroc.app
      # The updater's package, as Tauri made it: cargo-packager makes it
      # only when it signs.
      - name: Make the update archive
        if: inputs.update-archives
        run: tar -czf dist/gitcroc.app.tar.gz -C dist gitcroc.app
      - name: Collect the packages
        env:
          UPDATE_ARCHIVES: ${{ inputs.update-archives }}
        run: |
          mkdir upload
          files=("gitcroc_${VERSION}_universal.dmg")
          if [ "$UPDATE_ARCHIVES" = true ]; then
            files+=(gitcroc.app.tar.gz)
          fi
          for file in "${files[@]}"; do
            mv "dist/$file" upload/
          done
          ls -l upload | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: gitcroc-${{ env.VERSION }}-macos-universal
          path: upload/*
          if-no-files-found: error

      # B (M6-28c): the workspace at A's patch number plus one.
      - name: Build and package B
        if: inputs.update-test
        env:
          GITCROC_BUNDLE: app
        run: |
          newer=$(python3 .github/scripts/update_version.py --bump)
          echo "NEWER=$newer" >> "$GITHUB_ENV"
          cargo build --release --locked -p gitcroc-ui --bin gitcroc --target aarch64-apple-darwin $FEATURES
          cargo build --release --locked -p gitcroc-ui --bin gitcroc --target x86_64-apple-darwin $FEATURES
          lipo -create -output target/universal-apple-darwin/release/gitcroc \
            target/aarch64-apple-darwin/release/gitcroc target/x86_64-apple-darwin/release/gitcroc
          mkdir -p dist/b
          cargo packager --release -p gitcroc-ui --target universal-apple-darwin --formats app --out-dir dist/b
          codesign --verify --deep --strict dist/b/gitcroc.app
          tar -czf dist/b/gitcroc.app.tar.gz -C dist/b gitcroc.app
      # The only step with the update test's secret key in its environment.
      - name: Sign B's update package with the update test's key
        if: inputs.update-test
        run: |
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/update-test.key") \
            target/debug/release-manifest sign --version "$NEWER" dist/b/gitcroc.app.tar.gz
      - name: Collect B
        if: inputs.update-test
        run: |
          mkdir upload-b
          for file in dist/b/gitcroc.app.tar.gz; do
            mv "$file" "$file.sig" upload-b/
          done
          cp "$RUNNER_TEMP/update-test.pub" upload-b/
          ls -l upload-b | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: inputs.update-test
        with:
          name: update-test-macos-universal
          path: upload-b/*
          if-no-files-found: error
      - name: Delete the update test's key
        if: always() && inputs.update-test
        run: rm -f "$RUNNER_TEMP/update-test.key"

  # ubuntu-22.04 has glibc 2.35, the Linux floor of D6.
  linux:
    name: build (linux-x86_64)
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-packager and cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8,cargo-generate-rpm@0.21.1
      # GPUI's build packages (M6-03).
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: packages-linux${{ inputs.update-test && '-update-test' || '' }}
      # The update test's key (M6-28c). Its public half and the local
      # endpoint go into every binary of this job; its secret half signs
      # B's update package and is deleted in the job's last step.
      - name: Make the update test's key
        if: inputs.update-test
        run: |
          cargo build --quiet --locked -p release-manifest
          target/debug/release-manifest keygen "$RUNNER_TEMP/update-test.key" > "$RUNNER_TEMP/update-test.pub"
          {
            echo "GITCROC_UPDATE_TEST_KEY=$(cat "$RUNNER_TEMP/update-test.pub")"
            echo "GITCROC_UPDATE_TEST_ENDPOINT=http://127.0.0.1:8765/latest.json"
            echo "FEATURES=--features gitcroc-app/update-test"
          } >> "$GITHUB_ENV"
      # Only gitcroc-app, which reads GITCROC_BUNDLE, and the binary are
      # built again for each package.
      - name: Build and package the AppImage
        env:
          GITCROC_BUNDLE: appimage
        run: |
          cargo build --release --locked -p gitcroc-ui --bin gitcroc $FEATURES
          mkdir -p dist
          cargo packager --release -p gitcroc-ui --formats appimage --out-dir dist
          # cargo-packager names it x86_64; rc.1's name is amd64.
          mv "dist/gitcroc_${VERSION}_x86_64.AppImage" "dist/gitcroc_${VERSION}_amd64.AppImage"
      - name: Build and package the .deb
        env:
          GITCROC_BUNDLE: deb
        run: |
          cargo build --release --locked -p gitcroc-ui --bin gitcroc $FEATURES
          cargo packager --release -p gitcroc-ui --formats deb --out-dir dist
          dpkg-deb --info "dist/gitcroc_${VERSION}_amd64.deb"
      - name: Build and package the .rpm
        env:
          GITCROC_BUNDLE: rpm
        run: |
          cargo build --release --locked -p gitcroc-ui --bin gitcroc $FEATURES
          # An RPM version has no '-'; a pre-release takes '~', which sorts
          # it before the release (Eric, 2026-11-04). The file keeps rc.1's
          # name.
          cargo generate-rpm -p crates/gitcroc-ui -o dist/ --set-metadata "version = \"${VERSION//-/\~}\""
          mv "dist/gitcroc-${VERSION//-/\~}-1.x86_64.rpm" "dist/gitcroc-${VERSION}-1.x86_64.rpm"
      - name: Collect the packages
        run: |
          mkdir upload
          for file in "gitcroc_${VERSION}_amd64.AppImage" "gitcroc_${VERSION}_amd64.deb" "gitcroc-${VERSION}-1.x86_64.rpm"; do
            mv "dist/$file" upload/
          done
          ls -l upload | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: gitcroc-${{ env.VERSION }}-linux-x86_64
          path: upload/*
          if-no-files-found: error

      # B (M6-28c): the workspace at A's patch number plus one.
      - name: Build and package B
        if: inputs.update-test
        env:
          GITCROC_BUNDLE: appimage
        run: |
          newer=$(python3 .github/scripts/update_version.py --bump)
          echo "NEWER=$newer" >> "$GITHUB_ENV"
          cargo build --release --locked -p gitcroc-ui --bin gitcroc $FEATURES
          mkdir -p dist/b
          cargo packager --release -p gitcroc-ui --formats appimage --out-dir dist/b
          mv "dist/b/gitcroc_${newer}_x86_64.AppImage" "dist/b/gitcroc_${newer}_amd64.AppImage"
      # The only step with the update test's secret key in its environment.
      - name: Sign B's update package with the update test's key
        if: inputs.update-test
        run: |
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/update-test.key") \
            target/debug/release-manifest sign --version "$NEWER" "dist/b/gitcroc_${NEWER}_amd64.AppImage"
      - name: Collect B
        if: inputs.update-test
        run: |
          mkdir upload-b
          for file in "dist/b/gitcroc_${NEWER}_amd64.AppImage"; do
            mv "$file" "$file.sig" upload-b/
          done
          cp "$RUNNER_TEMP/update-test.pub" upload-b/
          ls -l upload-b | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: inputs.update-test
        with:
          name: update-test-linux-x86_64
          path: upload-b/*
          if-no-files-found: error
      - name: Delete the update test's key
        if: always() && inputs.update-test
        run: rm -f "$RUNNER_TEMP/update-test.key"

  # The install jobs take this run's artifacts, never rebuilt substitutes;
  # an update test's run has its own (update-test.yml).
  # Each writes settings.toml with update_check = false before the app first
  # starts, so nothing contacts GitHub (D12), and waits for the app's start
  # line and its `git --version`, never for a time (install_common.py).
  install-windows:
    if: ${{ !inputs.update-test }}
    name: install (windows-x64)
    needs: [version, windows]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the start checker without starting an app
        working-directory: .github/scripts
        run: python test-install.py
      - name: Record the runner version
        shell: bash
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH; image $ImageOS $ImageVersion" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          name: gitcroc-${{ env.VERSION }}-windows-x64
          path: artifacts
      - name: Install, start and uninstall; start the portable zip
        shell: pwsh
        run: |
          $env:INSTALL_LOGS = Join-Path $env:GITHUB_WORKSPACE 'install-logs'
          .github/scripts/install-windows.ps1 -Artifacts "$pwd/artifacts" -Version $env:VERSION
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-windows-x64
          path: install-logs
          if-no-files-found: warn

  # PLAT-4: the GPUI installer upgrades an installed 1.0.0-rc.1 in place.
  install-windows-over-rc1:
    if: ${{ !inputs.update-test }}
    name: install over rc.1 (windows-x64)
    needs: [version, windows]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # rc.1's installer is downloaded from its release.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record the runner version
        shell: bash
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH; image $ImageOS $ImageVersion" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          name: gitcroc-${{ env.VERSION }}-windows-x64
          path: artifacts
      - name: Install rc.1, upgrade it with /P /UPDATE, start
        shell: pwsh
        run: |
          $env:INSTALL_LOGS = Join-Path $env:GITHUB_WORKSPACE 'install-logs'
          .github/scripts/install-windows-over-rc1.ps1 -Artifacts "$pwd/artifacts" -Version $env:VERSION
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-windows-x64-over-rc1
          path: install-logs
          if-no-files-found: warn

  install-macos:
    if: ${{ !inputs.update-test }}
    name: install (macos-universal)
    needs: [version, macos]
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the start checker without starting an app
        working-directory: .github/scripts
        run: python3 test-install.py
      - name: Record the runner version
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH; image $ImageOS $ImageVersion" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          name: gitcroc-${{ env.VERSION }}-macos-universal
          path: artifacts
      - name: Install from the .dmg, check it and start it
        run: INSTALL_LOGS="$GITHUB_WORKSPACE/install-logs" .github/scripts/install-macos.sh "$PWD/artifacts" "$VERSION"
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-macos-universal
          path: install-logs
          if-no-files-found: warn

  install-linux:
    if: ${{ !inputs.update-test }}
    name: install (linux-x86_64)
    needs: [version, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Test the start checker without starting an app
        working-directory: .github/scripts
        run: python3 test-install.py
      - name: Record the runner version
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH; image $ImageOS $ImageVersion" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          name: gitcroc-${{ env.VERSION }}-linux-x86_64
          path: artifacts
      - name: Start the AppImage; install the .deb and start it
        run: INSTALL_LOGS="$GITHUB_WORKSPACE/install-logs" .github/scripts/install-linux.sh "$PWD/artifacts" "$VERSION"
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-linux-x86_64
          path: install-logs
          if-no-files-found: warn

  # The .rpm on Fedora, which the Ubuntu runner cannot install it on. No
  # font is installed before it, so the font it requires is what brings one.
  install-rpm:
    if: ${{ !inputs.update-test }}
    name: install (rpm, fedora)
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # git for the checkout and for the app (PLAT-3), Python for the start
      # checker; neither brings a font.
      - name: Install git, tar and Python
        run: dnf install -y git tar python3
      - uses: actions/checkout@v7
      - name: Record the container's version
        run: grep PRETTY_NAME /etc/os-release | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        with:
          name: gitcroc-${{ env.VERSION }}-linux-x86_64
          path: artifacts
      - name: Install the .rpm with dnf and start it
        run: INSTALL_LOGS="$GITHUB_WORKSPACE/install-logs" .github/scripts/install-rpm.sh "$PWD/artifacts" "$VERSION"
      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-logs-rpm
          path: install-logs
          if-no-files-found: warn
