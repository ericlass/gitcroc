# M5-13: a pushed tag `v<version>` builds every package of section 11 (D6)
# with bundles.yml, signs the update packages with the project's updater key
# (SEC-7) and prepares a draft GitHub release with the files, SHA256SUMS, the
# release notes and the updater's latest.json (PLAT-4). Eric checks the draft
# and publishes it; nothing here publishes. RELEASING.md has the steps.
#
# By hand (workflow_dispatch) and on pull requests that change the release
# files, it is a dry run: it builds, signs with a key made for the run, and
# uploads what the release would get as workflow artifacts, but creates no
# release. The project's key reaches tag builds only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/bundles.yml
      - crates/gitcroc-app/tauri.release.conf.json
      - tools/release-manifest/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag's release is never cancelled halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails at once, before any build, unless the tag is `v` plus the workspace
  # version (one_version_number, M0-08) and CHANGELOG.md has its section.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Read version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(cargo pkgid --locked -p gitcroc-app)
          version=${id##*[#@]}
          echo "gitcroc $version"
          if [ "$EVENT" = push ] && [ "$TAG" != "v$version" ]; then
            echo "::error::the tag $TAG is not v$version, the version in Cargo.toml"
            exit 1
          fi
          # A version with a pre-release part, such as 1.0.0-rc.1.
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check the changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ github.event_name != 'push' && '--dry-run' || '' }}
        run: cargo run --quiet --locked -p release-manifest -- section --version "$VERSION" $DRY_RUN

  bundles:
    needs: prepare
    uses: ./.github/workflows/bundles.yml
    with:
      signing: ${{ github.event_name == 'push' && 'project' || 'throwaway' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

  # Everything the release gets, in one workflow artifact; it reads only.
  assemble:
    needs: [prepare, bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          pattern: gitcroc-${{ needs.prepare.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Write latest.json, the notes and SHA256SUMS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ github.event_name != 'push' && '--dry-run' || '' }}
        run: |
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir notes
          cargo run --quiet --locked -p release-manifest -- assemble --version "$VERSION" \
            --pub-date "$pub_date" --dir dist $DRY_RUN > notes/notes.md
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: List the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          {
            echo "## gitcroc $VERSION"
            echo
            if [ "$PRERELEASE" = true ]; then echo "A pre-release."; echo; fi
            echo '```'
            ls -l dist
            echo '```'
            echo
            echo '### latest.json'
            echo '```json'
            cat dist/latest.json
            echo '```'
            echo
            echo '### Notes'
            echo
            cat notes/notes.md
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the release
        uses: actions/upload-artifact@v7
        with:
          name: gitcroc-${{ needs.prepare.outputs.version }}-release
          path: |
            dist/*
            notes/notes.md
          if-no-files-found: error

  # The only job that writes: a draft release from a pushed tag. Eric
  # publishes it.
  draft:
    if: github.event_name == 'push'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: gitcroc-${{ needs.prepare.outputs.version }}-release
          path: release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "gitcroc $VERSION" --notes-file release/notes/notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" "${args[@]}" release/dist/*
