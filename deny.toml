# cargo-deny configuration (QA-1). The project is MIT (D14); every dependency
# must carry a license compatible with it.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# MPL-2.0 is accepted for dependencies only; the project's own crates are MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
# The allowlist is the policy; not every license is in use yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
