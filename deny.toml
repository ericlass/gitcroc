# cargo-deny configuration (QA-1). The project is MIT (D14); every dependency
# must carry a license compatible with it.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste is unmaintained, not vulnerable. tikv-jemalloc-ctl, which the
    # allocator's test reads (M5-17), uses this proc macro at build time; it
    # is a dev-dependency only.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc macro, via the dev-dependency tikv-jemalloc-ctl" },
    # These zbus 5 crates are unmaintained, not vulnerable: they were merged
    # into zbus 6. keyring's Linux store (D11) reaches the Secret Service
    # through zbus 5, and no release of it uses zbus 6 yet.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained zvariant, via keyring's zbus 5 Secret Service store on Linux" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained zbus_names, via keyring's zbus 5 Secret Service store on Linux" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained zvariant_derive, via keyring's zbus 5 Secret Service store on Linux" },
    # These four are unmaintained, not vulnerable, and come with GPUI, the UI
    # toolkit (section 4 "Stack", M6-03, M6-06).
    { id = "RUSTSEC-2024-0384", reason = "unmaintained instant, via gpui-component and gpui-base" },
    { id = "RUSTSEC-2025-0134", reason = "unmaintained rustls-pemfile, via gpui-pre-reqwest, which gpui-kit-assets uses on WebAssembly only" },
    { id = "RUSTSEC-2026-0206", reason = "unmaintained rustybuzz, via usvg and resvg, GPUI's SVG renderer" },
    { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser, via fontdb, cosmic-text and usvg: GPUI's fonts and SVGs" },
    # Unmaintained, not vulnerable: syntect (UI-24, M6-07) loads its bundled
    # syntax definitions through bincode 1, and no syntect release has
    # replaced it.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode 1, via syntect's bundled syntaxes for code highlighting" },
]

[licenses]
# MPL-2.0 is accepted for dependencies only; the project's own crates are MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # enum-iterator and enum-iterator-derive, which gpui-component uses
    # (M6-06): a public-domain-like license, compatible with MIT.
    "0BSD",
]
confidence-threshold = 0.93
# The allowlist is the policy; not every license is in use yet.
unused-allowed-license = "allow"

# notify, the file watcher section 4 names (PERF-6), is CC0-1.0: a public
# domain dedication, compatible with MIT. Allowed for this crate only (M1-11).
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

# tiny-keccak, which ahash reaches through const-random (GPUI's X11 input
# methods, zed-xim, M6-06), is CC0-1.0, like notify. Allowed for this crate
# only.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# webpki-root-certs, the Mozilla root certificates that rustls-platform-verifier
# falls back to under reqwest (section 4 "Stack", M4-03), is
# CDLA-Permissive-2.0: a permissive data license with no copyleft, compatible
# with MIT. Allowed for this crate only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
