# cargo-deny configuration (QA-1). The project is MIT (D14); every dependency
# must carry a license compatible with it.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Tauri's Linux backend (D2) uses WebKitGTK 4.1, whose gtk-rs 0.18 bindings
    # pull in glib-macros, which uses this proc macro at build time. No
    # alternative exists until Tauri moves off GTK 3.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via glib-macros 0.18 under Tauri on Linux" },
    # paste is unmaintained, not vulnerable. specta's `function` feature, which
    # tauri-specta needs for typed commands (section 4 "Stack"), uses this proc
    # macro at build time.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc macro, via specta's function feature for tauri-specta" },
]

[licenses]
# MPL-2.0 is accepted for dependencies only; the project's own crates are MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
# The allowlist is the policy; not every license is in use yet.
unused-allowed-license = "allow"

# notify, the file watcher section 4 names (PERF-6), is CC0-1.0: a public
# domain dedication, compatible with MIT. Allowed for this crate only (M1-11).
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
