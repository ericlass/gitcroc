[workspace]
resolver = "3"
members = [
    "crates/gitcroc-git",
    "crates/gitcroc-core",
    "crates/gitcroc-ai",
    "crates/gitcroc-app",
    "crates/gitcroc-cli",
    "tools/req-coverage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
gitcroc-git = { path = "crates/gitcroc-git" }
gitcroc-core = { path = "crates/gitcroc-core" }
gitcroc-ai = { path = "crates/gitcroc-ai" }

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }

# IPC types (section 4 "Stack"). specta, tauri-specta and specta-typescript are
# pinned together: tauri-specta requires this exact specta. The exact versions
# are recorded in the M0-05 pull request.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Shell (D2). The exact versions are recorded in the M0-04 pull request.
tauri = { version = "2.12.3", features = [] }
tauri-build = { version = "2.7.2", features = [] }
# Timers in async commands; the same tokio Tauri runs on.
tokio = { version = "1.53.2", features = ["time"] }

# Test-only
cargo_metadata = "0.23.1"
toml = "1.1.8"
serde_json = "1.0.154"

# QA-4: no unsafe anywhere; no unwrap/expect outside tests. The tests' allowance
# lives in clippy.toml. Every crate opts in with `[lints] workspace = true`;
# qa_4_workspace_lints_forbid_unsafe_and_unwrap checks this block.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
