[workspace]
resolver = "3"
members = [
    "crates/gitcroc-git",
    "crates/gitcroc-core",
    "crates/gitcroc-ai",
    "crates/gitcroc-app",
    "crates/gitcroc-cli",
    "crates/gitcroc-ui",
    "tools/req-coverage",
    "tools/release-manifest",
    "tools/repo-gen",
]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
gitcroc-git = { path = "crates/gitcroc-git" }
gitcroc-core = { path = "crates/gitcroc-core" }
gitcroc-ai = { path = "crates/gitcroc-ai" }
gitcroc-app = { path = "crates/gitcroc-app" }
# Test fixtures and reference data (QA-2); a dev-dependency only.
repo-gen = { path = "tools/repo-gen" }

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }

# The derives the IPC types had (section 4 "Stack"), kept on the core's
# types until M6-30 removes them. The exact version is recorded in the M0-05
# pull request.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

# Return freed Rust allocations independently of glibc's per-thread arenas (M5-17).
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = "0.7.0"
# Async runtime and child processes. Crates add the features they use.
tokio = { version = "1.53.2", features = [] }

# Git reads (ARCH-2, section 4 "Stack"). Features are added as the read API
# grows: `revision` for rev-parse (M1-02), `blob-diff` for tree and file
# diffs with rename detection and attributes (M1-03), `status` for the
# working copy (M1-04). The exact version is recorded in the M1-01 pull
# request.
gix = { version = "0.89.0", default-features = false, features = ["sha1", "max-performance-safe", "revision", "blob-diff", "status", "merge"] }

# Settings (DATA-1): the platform config dir, the file format and the
# temporary file of the atomic write.
directories = "6.0.0"
toml = "1.1.8"
tempfile = "3.27.0"

# Workspaces (M1-05): the file's uuid, paths without Windows' `\\?\` prefix
# where possible, and, on Windows, telling whether two paths are the same
# folder (PLAT-2).
uuid = { version = "1.28.0", features = ["v4"] }
dunce = "1.0.5"
same-file = "1.0.6"

# The summary cache (PERF-3, M1-06): SQLite built into the binary, so no
# system library is needed on any platform.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# File watching (PERF-6, M1-11). The debounce is gitcroc's own, per repo:
# notify's debouncer crates debounce per path. The exact version is recorded
# in the M1-11 pull request.
notify = "8.2.0"

# The background refresh runs at the lowest thread priority (PERF-4, M1-13):
# niceness 19 on Linux, the scheduling priority on macOS, the thread priority
# on Windows. The exact version is recorded in the M1-13 pull request.
thread-priority = "3.1.1"

# HTTP for the API providers (section 4 "Stack", M4-03): rustls, so no
# system TLS library is needed. No HTTP/2, no charset decoding: the providers
# answer UTF-8 JSON. Streams are read chunk by chunk, so the `stream` feature
# is not needed.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }

# The CLI providers' processes (M4-04): a process group on Unix and a job
# object on Windows, so cancelling kills the CLI with every process it
# started, without unsafe code of our own (QA-4). `windows` names the creation
# flag that keeps the CLI from opening a console window; it is the version
# process-wrap uses.
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }

# AI keys in the OS keychain (D11, M4-05): Keychain Services on macOS, the
# Credential Manager on Windows and the Secret Service on Linux, through its
# v1 API, which picks the platform's store.
keyring = "4.2.0"

# The native UI (section 4 "Stack", M6-06), at the exact versions the M6
# spikes used. gpui-kit is GPUI itself; gpui-component is its component
# library. gpui-kit's default `assets` feature only registers the Lucide
# icons, which gpui-component depends on anyway; the UI supplies its own
# icons, so it is off.
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component"] }
gpui-component = "=0.8.1"
# Code highlighting (UI-24), with the features gpui-component uses: the
# pure Rust regex engine, so no C library comes in.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
# The Linux settings portal for the accent colour and the desktop's fonts
# (UI-23, UI-26), with the features and executor GPUI uses.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "settings"] }
futures-lite = "2.6.1"
async-io = "2.6.0"

# Test-only, except serde_json, which gitcroc-cli uses for its output
cargo_metadata = "0.23.1"
serde_json = "1.0.154"
# The D15 scan of gitcroc-ui's source.
syn = { version = "2.0.119", features = ["full", "visit"] }
proc-macro2 = "1.0.107"

# QA-4: no unsafe anywhere; no unwrap/expect outside tests. The tests' allowance
# lives in clippy.toml. Every crate opts in with `[lints] workspace = true`;
# qa_4_workspace_lints_forbid_unsafe_and_unwrap checks this block.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
