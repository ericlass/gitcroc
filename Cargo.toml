[workspace]
resolver = "3"
members = [
    "crates/gitcroc-git",
    "crates/gitcroc-core",
    "crates/gitcroc-ai",
    "crates/gitcroc-app",
    "crates/gitcroc-cli",
    "tools/req-coverage",
    "tools/repo-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
gitcroc-git = { path = "crates/gitcroc-git" }
gitcroc-core = { path = "crates/gitcroc-core" }
gitcroc-ai = { path = "crates/gitcroc-ai" }
# Test fixtures and reference data (QA-2); a dev-dependency only.
repo-gen = { path = "tools/repo-gen" }

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }

# IPC types (section 4 "Stack"). specta, tauri-specta and specta-typescript are
# pinned together: tauri-specta requires this exact specta. The exact versions
# are recorded in the M0-05 pull request.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Shell (D2). The exact versions are recorded in the M0-04 pull request.
tauri = { version = "2.12.3", features = [] }
tauri-build = { version = "2.7.2", features = [] }
# The folder picker, opened from Rust only (SEC-2, M1-05). The front end gets
# no dialog permission.
tauri-plugin-dialog = "2.8.0"
# Async runtime and child processes; the same tokio Tauri runs on. Crates add
# the features they use.
tokio = { version = "1.53.2", features = [] }

# Git reads (ARCH-2, section 4 "Stack"). Features are added as the read API
# grows: `revision` for rev-parse (M1-02), `blob-diff` for tree and file
# diffs with rename detection and attributes (M1-03), `status` for the
# working copy (M1-04). The exact version is recorded in the M1-01 pull
# request.
gix = { version = "0.89.0", default-features = false, features = ["sha1", "max-performance-safe", "revision", "blob-diff", "status"] }

# Settings (DATA-1): the platform config dir, the file format and the
# temporary file of the atomic write.
directories = "6.0.0"
toml = "1.1.8"
tempfile = "3.27.0"

# Workspaces (M1-05): the file's uuid, paths without Windows' `\\?\` prefix
# where possible, and, on Windows, telling whether two paths are the same
# folder (PLAT-2).
uuid = { version = "1.28.0", features = ["v4"] }
dunce = "1.0.5"
same-file = "1.0.6"

# The summary cache (PERF-3, M1-06): SQLite built into the binary, so no
# system library is needed on any platform.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Image diffs cross IPC as base64 text (M1-09): Tauri's raw byte responses
# have no generated TypeScript type.
base64 = "0.23.1"

# Test-only, except serde_json, which gitcroc-cli uses for its output
cargo_metadata = "0.23.1"
serde_json = "1.0.154"

# QA-4: no unsafe anywhere; no unwrap/expect outside tests. The tests' allowance
# lives in clippy.toml. Every crate opts in with `[lints] workspace = true`;
# qa_4_workspace_lints_forbid_unsafe_and_unwrap checks this block.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
